name: Build Zuno (Windows)

# Manuale: vai su Actions > Build Zuno (Windows) > Run workflow.
# Aggiungi "push: branches: [main]" sotto se vuoi anche che parta ad ogni push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # I runner windows-latest di GitHub includono già CMake preinstallato,
      # quindi qui non serve il passaggio che ti serviva in locale.

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: zuno-windows-build
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/**
          if-no-files-found: error
